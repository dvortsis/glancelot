    title: Copy/move Overwrite never destroys the existing target
    requirements: [META-07, SYS-06, SYS-02]
    owner: lead
    state: done
    integrated_commit: dab3c74035b5a8b86f5c9a75b2cccc9d7a5f61a1
    integrated_evidence: "docs/verification/integrate-cycle1-f-2026-10-24/README.md; Windows 51/51 and Docker 50/50 on 71477bd"
