    priority: 1
    outcome: An Overwrite copy or move writes to a temporary file beside the target and replaces the target atomically only after a complete, verified copy; a failed or cancelled copy leaves the original target byte-identical
    evidence_of_problem: "Found while drafting OPERATION-JOURNAL (claude/contracts-draft-b b1c835d): src/app/copy_move_service.cpp:437 opens the destination with QIODevice::Truncate, so the user's existing file is destroyed before the copy starts, and :481 calls QFile::remove(destPath) after a failed copy, deleting it outright."
    acceptance: Tests for Overwrite with a failing source read, a full or read-only target volume (simulated), cancellation mid-copy and a crash after the temp write; each leaves the original target byte-identical and no temp file behind after cleanup; same-volume and cross-volume move; Windows replace semantics (ReplaceFileW/MoveFileEx) and Linux rename verified; no change to the non-Overwrite policies
    note: "Ships before B2. B2 (OPERATION-JOURNAL) later adds journaling and 'move the old target to trash' on top."
