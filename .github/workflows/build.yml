name: Build and test
on:
  push:
    # gate/* pushes are full gates in windows-gate.yml; running these jobs there too only duplicates work.
    branches-ignore: ['gate/**']
  pull_request:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DGLANCELOT_BUILD_VIEWER=OFF -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
  viewer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtshadertools qtimageformats
          cache: true
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
