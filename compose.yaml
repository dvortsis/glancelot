services:
  glancelot:
    build: .
    ports:
      - "${GLANCELOT_BIND_ADDRESS:-127.0.0.1}:${GLANCELOT_PORT:-6080}:6080"
    volumes:
      - type: bind
        source: ${GLANCELOT_PHOTOS:?Set GLANCELOT_PHOTOS to your photo directory}
        target: /photos
        read_only: true
      - glancelot-config:/config
    secrets:
      - vnc_password
    environment:
      VNC_PASSWORD_FILE: /run/secrets/vnc_password
      DESKTOP_SIZE: ${GLANCELOT_DESKTOP_SIZE:-1440x900}
    shm_size: 512mb
    restart: unless-stopped
    stop_grace_period: 20s
secrets:
  vnc_password:
    file: ${GLANCELOT_PASSWORD_FILE:?Set GLANCELOT_PASSWORD_FILE to a password file}
volumes:
  glancelot-config:
